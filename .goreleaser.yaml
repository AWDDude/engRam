version: 2

project_name: engram

before:
  hooks:
    - go mod tidy

builds:
  - id: engram
    main: ./cmd/engram/
    binary: engram
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      # -X overrides the constant in cmd/engram/version.go so a published
      # binary always reports the tag it was built from, not whatever the
      # source happened to say.
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: engram
    homepage: https://github.com/AWDDude/engRam
    description: MCP server for long-term semantic memory
    repository:
      owner: AWDDude
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Formula
    install: bin.install "engram"
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
